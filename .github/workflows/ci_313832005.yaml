name: CI 313832005

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Run tests
        run: |
          mkdir -p reports
          npm run test:ci
          ls -R reports

      - name: Test Reporter
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Vitest Report
          path: reports/junit.xml
          reporter: jest-junit
